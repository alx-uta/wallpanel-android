# Mounted over /project/local.properties inside the android container.
#
# Gradle prefers sdk.dir here over the ANDROID_HOME env var, so without this the
# container would try to use the Windows SDK path from your host local.properties.
# Your host file is never modified -- this is a read-only overlay.
#
# This file is tracked in git, so it must never hold real credentials. Dev-flavor
# HA/MQTT test credentials live in local.testconfig.properties (gitignored; see
# local.testconfig.properties.example and WallPanelPro/build.gradle).
sdk.dir=/opt/android-sdk
