name: Manual Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Decode Keystore
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release-keystore.jks
      
    - name: Build and Sign Release APK
      run: ./gradlew assembleProdRelease
      env:
        KEYSTORE_FILE: ../release-keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    
    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WallPanel-${{ github.ref_name }}-${{ github.sha }}
        path: WallPanelPro/build/outputs/apk/prod/release/*.apk
        retention-days: 30
