plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt' // Allows for Kotlin annotation processors
    id 'com.github.sgtsilvio.gradle.android-retrofix' version '0.5.0'
}

def versionMajor = 1
def versionMinor = 1
def versionPatch = 7
def versionBuild = 0 // bump for dog food builds, public betas, etc.

// HA/MQTT test credentials for dev-flavor builds live in local.testconfig.properties
// (gitignored; see local.testconfig.properties.example), separate from local.properties'
// Gradle/SDK configuration.
def localTestProperties = new Properties()
def localTestPropertiesFile = project.rootProject.file('local.testconfig.properties')
if (localTestPropertiesFile.exists()) {
    localTestProperties.load(localTestPropertiesFile.newDataInputStream())
}

// Reads a dev-flavor test credential from local.testconfig.properties (see
// local.testconfig.properties.example).
def localProperty = { String key, String fallback = "" ->
    return localTestProperties.getProperty(key, fallback)
}

android {
    kapt {
        generateStubs = false
        correctErrorTypes = true
        javacOptions {
            option("-source", "17")
            option("-target", "17")
        }
    }
    namespace 'xyz.wallpanel.pro'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "xyz.wallpanel.pro"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}.${versionBuild}"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "wallpanel-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "wallpanel"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        unitTests {
            // Lets Robolectric read res/ and assets/ in JVM tests.
            includeAndroidResources = true
            // Un-stubbed android.jar methods return defaults instead of throwing,
            // so plain JUnit tests can touch Android types without Robolectric.
            returnDefaultValues = true
        }
    }

    flavorDimensions "default"

    productFlavors {
        def BASE_ENVIRONMENT = "BASE_ENVIRONMENT"
        dev {
            dimension "default"
            buildConfigField "String", BASE_ENVIRONMENT, '"DEV_ENVIRONMENT"'
            applicationId "xyz.wallpanel.pro"
            versionName "${versionMajor}.${versionMinor}.${versionPatch} Build ${versionBuild}-DEV"
            buildConfigField 'Integer', 'CODE', localProperty("code", "1234")
            buildConfigField 'String', 'HASS_URL', "\"" + localProperty("hassUrl") + "\""
            buildConfigField 'String', 'BROKER', "\"" + localProperty("broker") + "\""
            buildConfigField 'Integer', 'BROKER_PORT', localProperty("brokerPort", "1883")
            buildConfigField 'Boolean', 'BROKER_TLS', localProperty("brokerTls", "false")
            buildConfigField 'String', 'BROKER_PASS', "\"" + localProperty("brokerPass") + "\""
            buildConfigField 'String', 'BROKER_USERNAME', "\"" + localProperty("brokerUsername") + "\""
            buildConfigField 'String', 'CLIENT_ID', "\"" + localProperty("clientId", "mywallpanel") + "\""
            buildConfigField 'String', 'BASE_TOPIC', "\"" + localProperty("baseTopic", "wallpanel/mywallpanel/") + "\""
        }
        qa {
            dimension "default"
            buildConfigField "String", BASE_ENVIRONMENT, '"QA_ENVIRONMENT"'
            applicationId "xyz.wallpanel.pro"
            versionName "${versionMajor}.${versionMinor}.${versionPatch} Build ${versionBuild}-QA"
            buildConfigField 'Integer', 'CODE', '1234'
            buildConfigField 'String', 'HASS_URL', '""'
            buildConfigField 'String', 'BROKER', '""'
            buildConfigField 'Integer', 'BROKER_PORT', '1883'
            buildConfigField 'Boolean', 'BROKER_TLS', 'false'
            buildConfigField 'String', 'BROKER_USERNAME', '""'
            buildConfigField 'String', 'BROKER_PASS', '""'
            buildConfigField 'String', 'CLIENT_ID', '""'
            buildConfigField 'String', 'BASE_TOPIC', '""'
        }
        prod {
            dimension "default"
            buildConfigField "String", BASE_ENVIRONMENT, '"PROD_ENVIRONMENT"'
            applicationId "xyz.wallpanel.pro"
            versionName "${versionMajor}.${versionMinor}.${versionPatch} Build ${versionBuild}"
            buildConfigField 'Integer', 'CODE', '1234'
            buildConfigField 'String', 'HASS_URL', '""'
            buildConfigField 'String', 'BROKER', '""'
            buildConfigField 'Integer', 'BROKER_PORT', '1883'
            buildConfigField 'Boolean', 'BROKER_TLS', 'false'
            buildConfigField 'String', 'BROKER_USERNAME', '""'
            buildConfigField 'String', 'BROKER_PASS', '""'
            buildConfigField 'String', 'CLIENT_ID', '""'
            buildConfigField 'String', 'BASE_TOPIC', '""'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
    namespace 'xyz.wallpanel.pro'
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    // Navigation - Updated from 2.5.2
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // LiveData + ViewModel - Updated from 2.2.0/2.5.1 to 2.7.0
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$versions.retrofit"
    implementation "com.squareup.retrofit2:converter-gson:$versions.retrofit"

    // OKHttp
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Dagger
    implementation "com.google.dagger:dagger:$versions.dagger"
    kapt "com.google.dagger:dagger-compiler:$versions.dagger"
    implementation "com.google.dagger:dagger-android-support:$versions.dagger"
    kapt "com.google.dagger:dagger-compiler:$versions.dagger"
    implementation "com.google.dagger:dagger-android:$versions.dagger"
    kapt "com.google.dagger:dagger-android-processor:$versions.dagger"

    // MQTT
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.2'
    implementation 'com.koushikdutta.async:androidasync:2.1.9'
    
    // RetroFix backport for HiveMQ on Android API < 24 (Android 6 and below)
    // Backports CompletableFuture, Streams, and other Java 8 APIs
    retrofix 'net.sourceforge.streamsupport:android-retrostreams:1.7.4'
    retrofix 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'

    // Logging
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    kapt 'com.github.bumptech.glide:compiler:4.12.0'

    // GeckoView - Mozilla browser engine for modern web features
    // Using newer nightly build (134.+) with preferredColorScheme API support
    // Still supports Android 5.0+ (minSdk 21) including Android 8.1
    implementation "org.mozilla.geckoview:geckoview-nightly:134.+"

    // debugImplementation because LeakCanary should only run in debug builds.
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.9.1'
    // LeakCanary for releases
    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-release:2.9.1'
    // Optional: detect retained objects. This helps but is not required.
    releaseImplementation 'com.squareup.leakcanary:leakcanary-object-watcher-android:2.9.1'

    // Unit tests (JVM, no emulator)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.9'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    // Real org.json instead of the android.jar stub, so JSON parsing can be tested
    // without Robolectric.
    testImplementation 'org.json:json:20231013'

    // Instrumented tests (emulator/device)
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestUtil 'androidx.test:orchestrator:1.4.1'

}

configurations.all {
    resolutionStrategy {
        force "com.android.support:appcompat-v7:$versions.support"
    }
}

