<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
    <script>
        // On some GPUs (the TD-1050's PowerVR with WebView 84) the first paint of this page
        // now and then leaves the text as scrambled pixels until something repaints it. An
        // off-white background shortly after load is that repaint, and looks the same.
        window.addEventListener("load", function () {
            setTimeout(function () {
                document.body.style.backgroundColor = "#fffffe";
            }, 500);
        });
    </script>
</head>
<body>

<div class="wrapper">
    <div class="box">
        <center>
            <img src="icon.png" width="360px" height="360px">
            <h1>Connection Error</h1>
            <p>This page will automatically reload when connected.</p>
        </center>
    </div>
</div>

</body>
</html>
